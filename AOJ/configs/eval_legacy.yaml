run:
  name: legacy_notebook_eval

paths:
  experiment_root: outputs/experiments
  # 直接指向上你旧 Notebook 模型存放的目录！
  save_dir: outputs/experiments/gmu_asymmetric/checkpoints

data:
  # 指向当前工程下有效的数据路径（防止旧模型的路径失效）
  excel_path: data/raw/tabular_data.xlsx
  pkl_path: data/interim/clinical.pkl
  image_root: data/raw/image
  resnet_weight: weights/resnet18.pth

training:
  n_splits: 5
  batch_size: 8

eval:
  threshold: 0.25